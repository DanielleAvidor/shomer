<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E8EEE6">
<title>שומר – בודקים הודעה לפני שלוחצים</title>
<style>
  @font-face{font-family:"Open Sans";src:url(/static/fonts/opensans.woff) format("woff");font-weight:400 800;font-display:swap}
  @font-face{font-family:"Cardo";src:url(/static/fonts/cardo-bold.woff) format("woff");font-weight:700;font-display:swap}
  /* Palette "ink on pressed-leaf paper":
     Leaf Paper #E8EEE6 · Sheet #FBFBF7 · Bottle Ink #16302A · Pine #1D4B41 (the one action colour)
     Oxblood stamp #9E2320 · Bronze #76500A · Indigo seal #224C8C */
  :root{
    --paper:#E8EEE6; --sheet:#FBFBF7; --ink:#16302A; --soft:#41564E; --dim:#52655D;
    --line:#CBD6CB; --line-strong:#7E9187; --pine:#1D4B41; --pine-d:#143630; --wash:#DCE5DA;
    --red:#9E2320; --red-bg:#F8E9E5; --bronze:#76500A; --bronze-bg:#F7EDD2; --indigo:#224C8C; --indigo-bg:#E5ECF7;
    --serif:"Open Sans",system-ui,"Arial Hebrew",Arial,sans-serif; --sans:"Open Sans",system-ui,"Segoe UI","Arial Hebrew",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --shadow:0 1px 0 rgba(22,48,42,.06),0 10px 28px -14px rgba(22,48,42,.28);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.65 var(--sans);overflow-x:hidden}
  button{font:inherit;color:inherit}
  :focus-visible{outline:4px solid #4C8BD9;outline-offset:3px}
  [hidden]{display:none!important}
  bdi,.ltr{unicode-bidi:isolate}

  /* frame */
  .top{border-bottom:1px solid var(--line)}
  .top-in{max-width:1120px;margin:0 auto;padding:18px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 32px}
  .brand{display:flex;align-items:center;gap:12px;padding-bottom:12px}
  .brand svg{width:38px;height:38px;color:var(--pine);flex:none}
  .brand h1{font:800 36px/1 var(--serif);margin:0;color:var(--ink)}
  .brand span{font-size:16px;color:var(--soft);border-inline-start:1.5px solid var(--line-strong);padding-inline-start:12px;line-height:1.3}
  nav{display:flex;gap:2px;margin-inline-start:auto;width:100%}
  nav button{flex:1;white-space:nowrap;min-height:52px;border:0;background:transparent;color:var(--soft);font:600 17px var(--sans);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-1px;padding:0 6px}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--pine-d);border-bottom-color:var(--pine);font-weight:800}
  @media(min-width:760px){nav{width:auto}nav button{flex:none;padding:0 22px}}
  @media(max-width:520px){.brand span{display:none}}
  main{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

  /* check screen */
  .check{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:900px){
    .check{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-areas:"input result" "recent result";grid-template-rows:auto 1fr;gap:28px 48px;align-items:start}
    .input-col{grid-area:input}.result-col{grid-area:result;position:sticky;top:20px}.recent-col{grid-area:recent}
    #samples[hidden]{display:block!important}
  }
  label.q{display:block;font:800 30px/1.25 var(--serif);margin-bottom:14px}
  textarea{display:block;width:100%;min-height:176px;font:400 20px/1.6 var(--sans);padding:16px 18px;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line-strong);border-radius:16px;resize:vertical;box-shadow:inset 0 2px 0 rgba(22,48,42,.04)}
  textarea:focus{border-color:var(--pine);box-shadow:0 0 0 4px rgba(29,75,65,.16)}
  textarea::placeholder{color:var(--dim)}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--sheet);color:var(--ink);font:700 17px/1.2 var(--sans);cursor:pointer;text-decoration:none;text-align:center;white-space:nowrap}
  .btn:hover{border-color:var(--pine);background:#fff}
  .btn.primary{background:var(--pine);border-color:var(--pine);color:#fff;font-size:21px;min-height:62px;padding:0 30px;box-shadow:0 3px 0 var(--pine-d)}
  .btn.primary:hover{background:var(--pine-d)}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pine-d)}
  .row .btn.primary{flex:1 1 200px}
  .btn.quiet{border-color:transparent;background:transparent;min-height:48px;font-weight:600;text-decoration:underline;text-underline-offset:4px;color:var(--soft)}
  .btn.quiet:hover{background:transparent;color:var(--ink)}
  .hint{font-size:16px;color:var(--soft);margin:12px 0 0;max-width:46ch}
  .samples{margin-top:26px}
  .samples b,.recent h2{font:700 17px var(--sans);color:var(--soft);display:block;margin:0 0 10px}
  .chip{min-height:48px;padding:0 16px;margin:0 0 8px 8px;border-radius:12px;border:1.5px dashed var(--line-strong);background:transparent;cursor:pointer;font-size:17px;color:var(--ink)}
  .chip:hover{border-style:solid;border-color:var(--pine);background:var(--sheet)}
  .recent ul{list-style:none;margin:0;padding:0}
  .recent li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:17px}
  .recent li>div,.feed li>div{min-width:0;flex:1}
  .dot{flex:none;width:14px;height:14px;border-radius:50%}
  .dot.dont_click{background:var(--red)} .dot.cant_verify{background:#C28A12} .dot.matches_official{background:var(--indigo)}
  .recent time,.feed time{margin-inline-start:auto;font-size:15px;color:var(--soft);white-space:nowrap}
  .h{direction:ltr;unicode-bidi:isolate;text-align:right;font:400 15px var(--mono);color:var(--soft);overflow-wrap:anywhere}
  .recent .h{text-align:start}
  .recent li>.n{margin-inline-start:6px;font-size:14px;background:var(--wash);border-radius:99px;padding:0 9px;color:var(--soft)}

  /* home / how it works */
  .how{border:1.5px dashed var(--line-strong);border-radius:20px;padding:26px 24px}
  .how h2{font:800 28px/1.25 var(--serif);margin:0 0 6px}
  .how ol{margin:0;padding:0;list-style:none;counter-reset:s}
  .how li{counter-increment:s;display:flex;gap:16px;padding:14px 0 0}
  .how li::before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--pine);color:var(--pine);display:grid;place-items:center;font:800 18px var(--serif)}
  .how li b{display:block}
  .how li span{color:var(--soft);font-size:17px}

  /* the stamp card: the result */
  .card{background:var(--sheet);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  .dont_click{--c:var(--red);--cb:var(--red-bg)} .cant_verify{--c:var(--bronze);--cb:var(--bronze-bg)} .matches_official{--c:var(--indigo);--cb:var(--indigo-bg)}
  .head{background:var(--cb);padding:28px 22px 26px;border-bottom:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
  .stamp-wrap{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--c);padding:22px 18px 20px;margin:0 4px;border:4px solid var(--c);border-radius:18px;box-shadow:inset 0 0 0 6px var(--cb),inset 0 0 0 8px var(--c);transform:rotate(-2deg);mix-blend-mode:multiply;filter:url(#rough)}
  .stamp-wrap svg{width:54px;height:54px}
  .stamp-wrap h2{font:800 clamp(27px,7.6vw,36px)/1.15 var(--serif);margin:0;color:var(--c);text-wrap:balance;letter-spacing:-.01em}
  .adv{padding:20px 24px 4px;font-weight:700;font-size:21px;line-height:1.5;margin:0}
  .sec{padding:18px 24px 6px}
  .sec+.sec{border-top:1px dashed var(--line-strong);margin-top:12px;padding-top:20px}
  .sec h3{font:700 16px var(--sans);color:var(--soft);margin:0 0 8px}
  .host{direction:ltr;text-align:left;unicode-bidi:isolate;font:700 clamp(21px,5.6vw,30px)/1.3 var(--mono);overflow-wrap:anywhere;word-break:normal}
  .host.long{font-size:clamp(18px,4.8vw,24px)}
  .host .dim{color:var(--dim);font-weight:400}
  .host b{color:var(--c)}
  .dont_click .host b{text-decoration:underline wavy var(--red);text-decoration-thickness:2px;text-underline-offset:7px}
  .why{list-style:none;margin:0;padding:0}
  .why li{display:flex;gap:12px;padding:6px 0}
  .why li::before{content:"";flex:none;width:8px;height:8px;margin-top:12px;border-radius:50%;background:var(--c)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;display:flex;gap:14px;padding:8px 0}
  .steps li::before{content:counter(s);flex:none;width:32px;height:32px;margin-top:1px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font:800 17px var(--serif)}
  details.clicked{border:1.5px solid var(--line-strong);border-radius:14px;padding:0 16px;background:#fff}
  details.clicked summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer;line-height:1.4;padding:6px 0}
  details.clicked[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  details.clicked ul{margin:0 0 14px;padding-inline-start:22px}
  details.clicked li{padding:3px 0}
  .actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:22px 24px 8px}
  .actions .btn.primary{grid-column:1/-1}
  .actions .btn{font-size:17px;padding:0 10px;min-height:52px}
  .actions .btn.primary{font-size:21px;min-height:60px}
  .actions .btn.quiet{grid-column:1/-1}
  .foot{padding:6px 24px 22px;font-size:15px;color:var(--soft);margin:0}
  @media(max-width:520px){.actions{grid-template-columns:minmax(0,1fr)}}

  /* family + setup */
  .page{max-width:680px;margin:0 auto}
  .page h2{font:800 36px/1.2 var(--serif);margin:0 0 8px}
  .lead{color:var(--soft);margin:0 0 22px}
  .alert{border:1px solid #E3B7AF;border-inline-start:6px solid var(--red);background:var(--red-bg);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .alert b{display:block;font-size:21px;line-height:1.35;color:var(--red)}
  .alert .row{margin-top:12px}.alert time{font-size:15px;color:var(--soft)}
  .calm{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:16px;padding:18px 20px;margin-bottom:14px;font-weight:600}
  .calm svg{flex:none;width:30px;height:30px;color:var(--pine)}
  .stats{display:flex;gap:12px;margin:22px 0 8px}
  .stats span{flex:1;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--soft);line-height:1.35}
  .stats b{display:block;font:800 34px/1.1 var(--serif);color:var(--ink)}
  .feed-h{font:700 17px var(--sans);color:var(--soft);margin:26px 0 0}
  .feed{list-style:none;margin:6px 0 0;padding:0}
  .feed li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
  .feed .dot{margin-top:9px}
  .feed .h{text-align:start}
  .feed .done{color:var(--soft)}
  .invite{margin-top:14px}
  #s-done{margin-top:18px}
  .note{background:var(--wash);color:var(--ink);border-radius:14px;padding:14px 18px;font-size:16px;margin:0 0 22px}
  .note.bad{background:var(--red-bg);color:var(--red);font-weight:700}
  .form{display:grid;gap:22px}
  .form label.f{display:grid;gap:8px;font-weight:700}
  .form input[type=text],.form select{font:400 20px var(--sans);min-height:56px;padding:0 16px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--sheet);color:var(--ink)}
  .form input[type=text]:focus,.form select:focus{border-color:var(--pine);outline:0;box-shadow:0 0 0 4px rgba(29,75,65,.16)}
  .consent{border:1px solid var(--line);border-radius:18px;padding:8px 22px 12px;background:var(--sheet);box-shadow:var(--shadow)}
  .consent p{margin:12px 0 0;font:800 22px var(--serif)}
  .consent ul{margin:10px 0 0;padding-inline-start:22px}
  .consent li{padding:3px 0}
  .check-row{display:flex;gap:14px;align-items:flex-start;font-weight:600;cursor:pointer}
  .check-row input{width:28px;height:28px;margin-top:3px;flex:none;accent-color:var(--pine)}
  .invite{white-space:pre-wrap;background:var(--sheet);border:1.5px dashed var(--line-strong);border-radius:16px;padding:18px;margin-top:14px}

  @media (prefers-reduced-motion:no-preference){
    .stamp-wrap.stamp{animation:stamp .42s cubic-bezier(.2,.9,.3,1.2)}
    @keyframes stamp{from{transform:rotate(-9deg) scale(1.3);opacity:0}60%{opacity:1}to{transform:rotate(-2deg) scale(1)}}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></svg>
<div class="top"><div class="top-in">
  <div class="brand"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="12.5" stroke-width="1.4" stroke-dasharray="1.5 4"/><circle cx="20" cy="17.5" r="3.2"/><path d="M20 21v6.5"/></svg><h1>שומר</h1><span>בודקים הודעה<br>לפני שלוחצים</span></div>
  <nav role="tablist" aria-label="מסכים">
    <button role="tab" id="tab-check" aria-selected="true">בדיקת הודעה</button>
    <button role="tab" id="tab-fam" aria-selected="false">משפחה</button>
    <button role="tab" id="tab-setup" aria-selected="false">הגדרה</button>
  </nav>
</div></div>

<main>
<section id="p-check" class="check">
  <div class="input-col">
    <label class="q" for="msg">איזו הודעה קיבלתם?</label>
    <textarea id="msg" placeholder="הדביקו כאן את ההודעה"></textarea>
    <div class="row">
      <button class="btn primary" id="go">בדקו לי</button>
      <button class="btn" id="paste">הדבקה מהלוח</button>
    </div>
    <p class="hint">איך מעתיקים? לוחצים ומחזיקים על ההודעה, בוחרים "העתק", ואז לוחצים כאן ובוחרים "הדבק". ההודעה נבדקת מיד.</p>
    <div class="samples" id="samples"><b>רוצים לנסות? בחרו דוגמה:</b>
      <button class="chip" data-ex="0">דואר ישראל – דוגמה א</button>
      <button class="chip" data-ex="1">דואר ישראל – דוגמה ב</button>
      <button class="chip" data-ex="2">מנהרות הכרמל</button>
      <button class="chip" data-ex="3">הודעה בלי קישור</button>
      <button class="chip" data-ex="4">הודעה מ"הנכד"</button>
    </div>
  </div>
  <div class="result-col"><div id="out" aria-live="polite"></div></div>
  <div class="recent-col"><div class="recent" id="recent" hidden><h2>נבדקו לאחרונה</h2><ul id="recent-list"></ul></div></div>
</section>

<section id="p-fam" class="page" hidden></section>
<section id="p-setup" class="page" hidden></section>
</main>

<script>
const EX = [
  "דואר ישראל: החבילה שלך נעצרה בגלל כתובת שגויה. אנא אשר כתובת https://israelpost.paliet.top/il",
  "דואר ישראל: החבילה שלך הגיעה לסניף. מעקב: https://israelpost.co.il/track",
  "מנהרות הכרמל: חוב פתוח. לתשלום https://carmeltunnels.co.il.pay-now.top/bills",
  "בנק הפועלים: חשבונך ייחסם היום. התקשרו עכשיו למספר 03-5551234",
  "אבא זה אני, הטלפון נפל ואני במספר חדש. תעביר לי 2,000 ש\"ח דחוף"
];
const ICON = {
  dont_click:`<path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18"/><path d="M5.6 5.6l12.8 12.8"/>`,
  cant_verify:`<path d="M9 9a3 3 0 1 1 4.5 2.6C12.5 12.2 12 13 12 14.5"/><path d="M12 18.6v.1"/>`,
  matches_official:`<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>`
};
const LABEL = {dont_click:"הודעה מסוכנת", cant_verify:"לא הצלחנו לבדוק", matches_official:"תואם לאתר הרשמי"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post = (u, o) => fetch(u, {method:"POST", body: JSON.stringify(o || {})}).then(r => r.json());
const get = u => fetch(u).then(r => r.json());
const hm = ts => new Date(ts*1000).toLocaleTimeString("he-IL", {hour:"2-digit", minute:"2-digit"});
let last = null, settings = {name:"", relation:"", consented:false};

function seal(v, headline){
  return `<div class="stamp-wrap stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[v]}</svg><h2>${esc(headline)}</h2></div>`;
}
function hostHtml(host){
  const l = host.split("."), second = ["co.il","org.il","gov.il","muni.il","ac.il"];
  const n = l.length >= 3 && second.includes(l.slice(-2).join(".")) ? 3 : 2;
  const real = l.slice(-n).join("."), rest = l.slice(0, -n).join(".");
  return (rest ? `<span class="dim">${esc(rest)}.</span><wbr>` : "") + `<b>${esc(real)}</b>`;
}

/* ---------- tabs ---------- */
function show(tab){
  for (const t of ["check","fam","setup"]){ $("#tab-"+t).setAttribute("aria-selected", t === tab); $("#p-"+t).hidden = t !== tab; }
  if (tab === "fam") loadFamily(); if (tab === "setup") renderSetup(); if (tab === "check") loadRecent();
}
for (const t of ["check","fam","setup"]) $("#tab-"+t).onclick = () => show(t);

/* ---------- check ---------- */
function howItWorks(){
  $("#out").innerHTML = `<div class="how"><h2>איך שומר בודק</h2><ol>
    <li><div><b>מדביקים הודעה.</b><span>כל הודעה שנראית לכם חשודה: SMS, מייל או וואטסאפ.</span></div></li>
    <li><div><b>שומר משווה לאתר הרשמי.</b><span>הוא בודק אם הקישור שייך לגוף ששלח, ומחפש גם לחץ ובקשות חשודות.</span></div></li>
    <li><div><b>מקבלים תשובה ברורה.</b><span>מה לעשות עכשיו, ומה לעשות אם כבר לחצתם.</span></div></li></ol></div>`;
}
async function run(){
  const text = $("#msg").value.trim(); if (!text){ $("#msg").focus(); return; }
  $("#samples").hidden = true;
  const r = await post("/api/check", {text}); last = r; render(r); loadRecent();
}
function render(r){
  const out = $("#out"), v = r.verdict;
  if (!r.applicable){
    out.innerHTML = `<div class="card cant_verify"><div class="head">${seal("cant_verify", r.headline_he)}</div><p class="adv">${esc(r.advice_he)}</p>
      <div class="actions"><button class="btn quiet" id="again">בודקים הודעה אחרת</button></div></div>`;
    $("#again").onclick = reset; return;
  }
  $("#go").classList.remove("primary");
  const link = r.links[0];
  const dest = link && link.host ? `<div class="sec"><h3>הקישור בהודעה פותח את האתר</h3><div class="host${link.host.length > 22 ? " long" : ""}">${hostHtml(link.host)}</div></div>` : "";
  const why = r.reasons_he.length ? `<div class="sec"><h3>מה מצאנו</h3><ul class="why">${r.reasons_he.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const steps = r.steps_he.length ? `<div class="sec"><h3>מה עושים עכשיו</h3><ol class="steps">${r.steps_he.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : "";
  const clicked = r.if_clicked_he.length ? `<div class="sec"><details class="clicked"><summary>כבר לחצתי או מסרתי פרטים. מה עושים?</summary><ul>${r.if_clicked_he.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details></div>` : "";
  const official = r.official_url ? `<a class="btn primary official" href="${esc(r.official_url)}" target="_blank" rel="noopener">פותחים את האתר הרשמי</a>` : "";
  const note = v === "dont_click" ? "" : ` שומר לא קובע שהודעה אמיתית או בטוחה. הוא בודק רק אם הכתובת שייכת לאתר הרשמי של השולח.`;
  out.innerHTML = `<div class="card ${v}">
    <div class="head">${seal(v, r.headline_he)}</div>
    <p class="adv">${esc(r.advice_he)}</p>${dest}${why}${steps}${clicked}
    <div class="actions">${official}
      <button class="btn ${r.official_url ? "wa" : "primary"}" id="share">שליחה לבן משפחה בוואטסאפ</button>
      <button class="btn" id="save">שמירה כתמונה</button>
      <button class="btn quiet" id="again">בודקים הודעה אחרת</button></div>
    <p class="foot">נבדק בשעה <bdi>${hm(Date.now()/1000)}</bdi>.${note}</p></div>`;
  $("#share").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(r.share_text_he), "_blank", "noopener");
  $("#save").onclick = () => saveImage(r);
  $("#again").onclick = reset;
  if (!matchMedia("(min-width: 900px)").matches) out.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
}
function reset(){ $("#go").classList.add("primary"); $("#msg").value = ""; $("#samples").hidden = false; howItWorks(); last = null; window.scrollTo({top:0}); $("#msg").focus(); }
function dedupe(list){
  const out = [];
  for (const e of list){ const p = out[out.length-1];
    if (p && p.verdict === e.verdict && (p.host||"") === (e.host||"") && (p.org||"") === (e.org||"") && !!p.handled === !!e.handled){ p.n = (p.n||1) + 1; continue; }
    out.push({...e}); }
  return out;
}
async function loadRecent(){
  const g = await get("/api/guardian"); settings = g.settings;
  $("#recent").hidden = !g.recent.length;
  $("#recent-list").innerHTML = dedupe(g.recent).slice(0,5).map(e => `<li><span class="dot ${e.verdict}"></span><div>${LABEL[e.verdict]}${e.org ? " · " + esc(e.org) : ""}<div class="h">${esc(e.host || "")}</div></div>${e.n > 1 ? `<span class="n">×${e.n}</span>` : ""}<time>${hm(e.ts)}</time></li>`).join("");
}

$("#go").onclick = run;
$("#msg").addEventListener("paste", () => setTimeout(run, 80));
$("#msg").addEventListener("input", () => { $("#samples").hidden = $("#msg").value.trim() !== ""; });
$("#paste").onclick = async () => {
  try { $("#msg").value = await navigator.clipboard.readText(); run(); }
  catch { $("#msg").focus(); $(".hint").textContent = "לא הצלחנו לקרוא את הלוח. לחצו בתוך התיבה ובחרו \"הדבק\"."; }
};
document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { $("#msg").value = EX[b.dataset.ex]; run(); });

/* ---------- save as picture ---------- */
async function saveImage(r){
  await document.fonts.load("700 40px Cardo"); await document.fonts.load("400 24px 'Open Sans'");
  const W = 1080, c = document.createElement("canvas"), x = c.getContext("2d");
  const col = {dont_click:"#b3261e", cant_verify:"#7a5200", matches_official:"#1f4e8c"}[r.verdict];
  const lines = [];
  c.width = W; c.height = 1500; x.direction = "rtl"; x.textAlign = "right";
  const wrap = (t, font, maxW) => { x.font = font; const out = []; let cur = ""; for (const w of t.split(" ")) { const tr = cur ? cur + " " + w : w; if (x.measureText(tr).width > maxW && cur){ out.push(cur); cur = w; } else cur = tr; } if (cur) out.push(cur); return out; };
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, c.height); x.fillStyle = col; x.fillRect(0, 0, W, 18);
  // seal
  x.save(); x.translate(180, 230); x.rotate(-0.12); x.strokeStyle = col; x.lineWidth = 8; x.beginPath(); x.arc(0, 0, 110, 0, 7); x.stroke();
  x.lineWidth = 3; x.setLineDash([4, 12]); x.beginPath(); x.arc(0, 0, 92, 0, 7); x.stroke(); x.setLineDash([]);
  x.scale(6, 6); x.translate(-12, -12); x.lineWidth = 1.7; x.lineCap = "round";
  const paths = {dont_click:["M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18","M5.6 5.6l12.8 12.8"], cant_verify:["M9 9a3 3 0 1 1 4.5 2.6C12.5 12.2 12 13 12 14.5","M12 18.6v.1"], matches_official:["M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1","M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"]}[r.verdict];
  paths.forEach(p => x.stroke(new Path2D(p))); x.restore();
  let y = 190; x.fillStyle = col;
  for (const l of wrap(r.headline_he, "700 68px Cardo", 700)) { x.font = "700 68px Cardo"; x.fillText(l, 1020, y); y += 82; }
  y = Math.max(y, 400) + 30; x.fillStyle = "#0f1f2e";
  for (const l of wrap(r.advice_he, "600 34px 'Open Sans'", 940)) { x.font = "600 34px 'Open Sans'"; x.fillText(l, 1020, y); y += 52; }
  const host = r.links[0] && r.links[0].host;
  if (host){ y += 30; x.fillStyle = "#4a5b6b"; x.font = "600 26px 'Open Sans'"; x.fillText("הקישור בהודעה פותח את האתר", 1020, y); y += 70;
    x.direction = "ltr"; x.textAlign = "left"; x.fillStyle = col; x.font = "700 44px monospace"; x.fillText(host.length > 34 ? host.slice(0, 33) + "…" : host, 60, y); x.direction = "rtl"; x.textAlign = "right"; y += 40; }
  y += 30; x.fillStyle = "#0f1f2e";
  r.steps_he.forEach((s, i) => { for (const l of wrap(s, "400 32px 'Open Sans'", 880)) { x.font = "400 32px 'Open Sans'"; x.fillText(l, 1020, y); y += 48; } y += 10; });
  x.fillStyle = "#14365d"; x.fillRect(0, c.height - 120, W, 120); x.fillStyle = "#fff"; x.font = "700 46px Cardo"; x.fillText("שומר", 1020, c.height - 52);
  x.font = "400 24px 'Open Sans'"; x.textAlign = "left"; x.direction = "ltr"; x.fillText(new Date().toLocaleString("he-IL"), 60, c.height - 52);
  c.toBlob(async b => {
    const f = new File([b], "shomer-result.png", {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f]}); return; } catch {} }
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "shomer-result.png"; a.click();
  });
}

/* ---------- family ---------- */
async function loadFamily(){
  const g = await get("/api/guardian"); settings = g.settings;
  const who = settings.name || "המשפחה";
  const el = $("#p-fam");
  const groups = []; for (const a of g.alerts){ const q = groups[groups.length-1]; if (q && q.host === a.host && q.org === a.org){ q.ids.push(a.id); q.n++; } else groups.push({...a, ids:[a.id], n:1}); }
  const shown = groups.slice(0,3), more = groups.slice(3).reduce((t,x) => t + x.n, 0);
  const alerts = shown.map(a => `<div class="alert" role="alert"><b>${settings.name ? "הודעה מסוכנת הגיעה אל " + esc(settings.name) : "הגיעה הודעה מסוכנת"}</b>${esc(a.org || "גוף לא מזוהה")}${a.n > 1 ? ` (${a.n} פעמים)` : ""}<div class="h"><bdi>${esc(a.host || "בלי קישור")}</bdi></div><time><bdi>${hm(a.ts)}</bdi></time>
    <div class="row"><button class="btn" data-handled="${a.ids.join(",")}">סימון כטופל</button></div></div>`).join("") + (more ? `<p class="lead">ועוד ${more} התראות פתוחות.</p>` : "");
  const calm = !g.alerts.length ? `<div class="calm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg><span>אין כרגע התראות פתוחות. כשמשהו חשוד יגיע, זה יופיע כאן מיד.</span></div>` : "";
  const total = g.counts.dont_click + g.counts.cant_verify + g.counts.matches_official;
  const feed = g.recent.length ? dedupe(g.recent).slice(0,8).map(e => `<li><span class="dot ${e.verdict}"></span><div class="${e.handled ? "done" : ""}">${LABEL[e.verdict]}${e.org ? " · " + esc(e.org) : ""}${e.handled ? " · טופל" : ""}<div class="h">${esc(e.host || "")}</div></div>${e.n > 1 ? `<span class="n">×${e.n}</span>` : ""}<time>${hm(e.ts)}</time></li>`).join("") : `<li style="color:var(--soft)">עוד לא נבדקו הודעות.</li>`;
  el.innerHTML = `<h2>${esc(who)} – מה קורה</h2><p class="lead">מי שהוגדר כשומר המשפחתי רואה כאן רק מה קרה, ואף פעם לא את תוכן ההודעות.</p>
    ${settings.consented ? "" : `<p class="note">עוד לא הוגדרה הסכמה. עברו ללשונית "הגדרה" כדי להפעיל את השיתוף עם המשפחה.</p>`}
    ${settings.consented ? alerts + calm : ""}
    ${settings.consented ? `<div class="stats"><span><b>${total}</b>הודעות נבדקו</span><span><b>${g.counts.dont_click}</b>סומנו כמסוכנות</span></div>
    <h3 class="feed-h">מה קרה לאחרונה</h3><ul class="feed">${feed}</ul>` : ""}`;
  el.querySelectorAll("[data-handled]").forEach(b => b.onclick = async () => { for (const id of b.dataset.handled.split(",")) await post("/api/handled", {event_id: +id}); loadFamily(); });
}

/* ---------- setup ---------- */
function renderSetup(){
  const el = $("#p-setup");
  el.innerHTML = `<h2>הגדרה חד־פעמית</h2><p class="lead">בן או בת משפחה מגדירים את שומר פעם אחת, יחד עם מי שמוגן. אחר כך הכול קורה לבד.</p>
    <p class="note">בגרסת ההדגמה ההגדרות נשמרות רק בשרת המקומי שרץ על המחשב שלכם.</p>
    <div class="form">
      <label class="f">איך קוראים למי שמוגן?<input type="text" id="s-name" value="${esc(settings.name)}" placeholder="למשל: סבתא רחל"></label>
      <label class="f">מה הקשר?<select id="s-rel">${["סבתא","סבא","אמא","אבא","אחר"].map(o => `<option ${o === settings.relation ? "selected" : ""}>${o}</option>`).join("")}</select></label>
      <div class="consent"><p>מה שומר עושה, ומה הוא לא עושה</p><ul>
        <li>קורא הודעות SMS שנכנסות, רק כדי לבדוק אם יש בהן קישור או בקשה חשודה.</li>
        <li>הבדיקה נעשית בטלפון עצמו. תוכן ההודעות לא נשמר ולא נשלח.</li>
        <li>לבן המשפחה נשלחים רק: מה התוצאה, שם הגוף וכתובת האתר.</li>
        <li>אפשר להפסיק בכל רגע בהגדרות הטלפון.</li></ul></div>
      <label class="check-row"><input type="checkbox" id="s-ok" ${settings.consented ? "checked" : ""}><span>המוגן/ת קרא/ה והסכים/ה לכל האמור לעיל</span></label>
      <button class="btn primary" id="s-save">שמירת הגדרה</button>
    </div><div id="s-done"></div>`;
  $("#s-save").onclick = async () => {
    if (!$("#s-ok").checked){ $("#s-done").innerHTML = `<p class="note bad">כדי להמשיך צריך הסכמה של מי שמוגן.</p>`; return; }
    settings = await post("/api/settings", {name: $("#s-name").value.trim(), relation: $("#s-rel").value, consented: true});
    const invite = `הגדרתי עבורך את שומר. הוא בודק הודעות לפני שלוחצים עליהן, ומעדכן אותי רק כשמשהו חשוד, בלי לקרוא את ההודעות שלך.`;
    $("#s-done").innerHTML = `<p class="note">נשמר. עכשיו אפשר לשלוח הודעת הסבר.</p><div class="invite">${esc(invite)}</div>
      <div class="row"><button class="btn wa" id="s-wa">שליחה בוואטסאפ</button></div>`;
    $("#s-wa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(invite), "_blank", "noopener");
  };
}

howItWorks(); loadRecent();
</script>
