name: Demo site

# Publishes docs/ (the static demo) to GitHub Pages. One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the demo goes on the site
        run: mkdir site && cp docs/index.html site/ && cp -r docs/fonts site/fonts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
