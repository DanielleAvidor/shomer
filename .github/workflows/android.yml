name: Android debug APK

# Builds the Android app in the cloud, runs its unit tests, and attaches an installable debug APK to the run.
# Open the run under the Actions tab and download "shomer-debug-apk" at the bottom of the page.
on:
  push:
    paths: ["app/**", ".github/workflows/android.yml", "shomer/data/directory.json"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shomer-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
