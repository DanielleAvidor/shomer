name: Android debug APK

# Builds the Android app in the cloud, runs its unit tests, and attaches an installable debug APK to the run.
# Open the run under the Actions tab and download "shomer-debug-apk" at the bottom of the page.
on:
  push:
    paths: ["app/**", ".github/workflows/android.yml", "shomer/data/directory.json"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests and debug APK
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Surface the first errors as annotations so they can be read without downloading the log.
            grep -E "^e: |error:|What went wrong|FAILED|Caused by|Could not|Unresolved" -A2 build.log | head -60 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: shomer-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
