name: Android on an emulator

# Starts an Android emulator in the cloud, installs the app, sends it fake SMS messages and photographs what happens.
# Download "shomer-emulator-run" from the run page: screenshots, a screen recording and the notification text.
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "tools/e2e/**", ".github/workflows/android-e2e.yml", "shomer/data/directory.json"]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        working-directory: app
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shomer-emulator-run
          path: e2e-out/
      - name: Save the evidence in the repository (docs/proof)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/proof
          cp e2e-out/*.png e2e-out/shomer-notifications.txt docs/proof/ 2>/dev/null || true
          cp e2e-out/e2e.mp4 docs/proof/ 2>/dev/null || true
          grep -E "ShomerE2E.*(verdict|sms received)" e2e-out/logcat.txt > docs/proof/app-decisions.txt 2>/dev/null || true
          printf 'Run: %s\nCommit: %s\nEmulator: Android 13 (API 33), x86_64\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/proof/RUN.txt
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/proof
          git diff --cached --quiet || { git commit -m "Emulator evidence from run $GITHUB_RUN_ID [skip ci]"; git pull --rebase -q origin main; git push; }
